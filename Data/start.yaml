  choices:
    - text: 'Yes'
      result: GoToSchool
    - text: 'No'
      result: StayHome

GoToSchool:
  stats:
    - PlayerIntelligence: 1
  intro: 'You decide to go to school'
  text: 'Where do you want to sit on the bus?'
