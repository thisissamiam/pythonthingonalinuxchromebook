  text: 'Your brain cells are depleting. Do you keep scrolling?'
  textimage: LosingBrainScrollOnPhone
  choices:
    - text: 'Yes'
      result: KeepScrollingAgain
    - text: 'No'
      result: GetUpOutOfBed
KeepScrollingAgain:
  stats:
    - PlayerIntelligence: -5
    - PlayerHealth: -3
