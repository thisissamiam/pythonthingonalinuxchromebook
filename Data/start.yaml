WakeUp:
  text: 'You woke up from your bed. What do you do?'
  textimage: InBedLayingUp
  choices:
    - text: 'Go back asleep'
      result: GoBackAsleep
    - text: 'Get up'
      result: GetUpOutOfBed
    - text: 'Scroll on your phone'
      result: ScrollOnPhone

GoBackAsleep:
  intro: 'You go back to bed and sleep longer'
  introimage: InBedLayingDown
  text: 'You woke up and noticed you have missed the bus. What do you do?'
  stats:
    - PlayerIntelligence: -1
    - PlayerSoulPoint: 5
  textimage: InBedScared
  choices:
    - text: 'Ask mom for a ride'
      result: AskMomForARide
    - text: 'Walk to school'
      result: WalkToSchool
    - text: 'Skip school'
      result: SkipSchool

AskMomForARide:
  intro: 'You get up and find mom. She sees you and yells at you that you missed the bus. You ask her for a ride.'
  text: 'She says she has to go to work, and told you to figure it out yourself. What do you do?'
  stats:
    - PlayerHealth: -1
  choices:
    - text: 'Walk to school'
      result: WalkToSchool
    - text: 'Knock on other peoples doors untill one can give you a ride'
      result: KnockOnDoors
    - text: 'Skip school'
      result: SkipSchool

WalkToSchool:
  intro: 'You grab your stuff and go out the door. You notice a man nearby.'
  text: 'The man wanted to talk to you. What do you do?'
  stats:
    - PlayerHealth: 1
    - PlayerSpeed: 1
  choices:
    - text: 'Talk to the man'
      result: TalkToMan
    - text: 'Tell them that you need to walk to school and you are late'
      result: IgnoreMan
    - text: 'Punch them in the face'
      result: PunchMan

TalkToMan:
  intro: 'The man tells you that they have seen you before, and talks about life as he waters his plants.'
  text: 'The man asks you if you could fill up his watering can. What do you do?'
  stats:
    - PlayerIntelligence: 1
  choices:
    - text: 'Tell them you would love to but you really need to go'
      result: LeaveMan
    - text: 'Tell them sure, and help them fill up their watering can'
      result: HelpMan
    - text: 'Take the watering can from them and throw it'
      result: ThrowWateringCan

LeaveMan:
  intro: 'The man said that was fine, and told you that they would be happy to see you later.'
  text: 'You start walking to school, and look at your watch. You are 10 minutes late. What do you do?'
  choices:
    - text: 'Start running to school'
      result: RunToSchool
    - text: 'Eat out at a fast food place'
      result: EatFastFood
    - text: 'Keep walking how you were before'
      result: KeepWalking

RunToSchool:
  intro: 'You start running to school as fast as you can.'
  text: 'As you are running, your backpack is very heavy and is making it hard to run. What do you do?'
  stats:
    - PlayerSpeed: 1
    - PlayerHealth: -2
  choices:
    - text: 'Take off the backpack and forget about it so you can run faster'
      result: DropBackpack
    - text: 'Accept you will be a little late and start walking'
      result: WalkInstead
    - text: 'Keep running as is'
      result: KeepRunning

DropBackpack:
  intro: 'You take off the backpack, throw it into a bush and keep running'
  text: 'As you are running you need a drink. What do you do?'
  stats:
    - PlayerHealth: 1
  choices:
    - text: 'Keep running to school'
      result: KeepRunningThirsty
    - text: 'Go back to the backpack and get your waterbottle'
      result: GetWaterBottle
    - text: 'Walk the rest'
      result: WalkRest

KeepRunningThirsty:
  intro: 'You fought through the thirst and kept running'
  text: 'You make it to school, but you are unsure of what to do next. What do you do?'
  stats:
    - PlayerHealth: -2
    - PlayerSpeed: 1
  choices:
    - text: 'Sneak in school so you are not marked late'
      result: SneakIntoSchool
    - text: 'Go in the main office to declare you are late'
      result: MainOffice

SneakIntoSchool:
  intro: 'You find your way in, but you run into a teacher.'
  text: 'The teacher asks are you late for school. What do you do?'
  stats: 
    - PlayerIntelligence: -1
  choices:
    - text: 'Tell them that you were late'
      result: AdmitLate
    - text: 'Ignore them and push them out of the way'
      result: PushTeacher
    - text: 'Lie and say you are not late'
      result: LieToTeacher

AdmitLate:
  intro: 'The teacher is accepting and marks you as on time, and you walk to your first class.'
  text: 'You feel tired and want to take a nap, what do you do?'
  stats:
    - PlayerIntelligence: 1
  choices:
    - text: 'Take the nap on your desk'
      result: NapOnDesk
    - text: 'Sneak out after attendance so you can take a nap elsewhere'
      result: SneakOutNap
    - text: 'Pay attention and do not take a nap'
      result: StayAwake

NapOnDesk:
  intro: 'The teacher notices and sends you to the office'
  text: 'The principal asks you what happened. What do you say?'
  stats:
    - PlayerIntelligence: -1
    - PlayerSoulPoint: 1
    - PlayerHealth: 1
  choices:
    - text: 'You pull out a handbook, and act like you know everything in it, and say \nthat it says that if a student has sleep deprivation, then you can nap'
      result: HandbookRule
    - text: 'Lie'
      result: LieToPrincipal
    - text: 'IM SORRY IM SORRY IM SORRY *start crying*'
      result: Crying

HandbookRule:
  intro: 'The principal looks at you, and looks at the handbook.'
  text: 'The principal agrees, and says they are sorry. What do you say?'
  stats:
    - PlayerIntelligence: 1
  choices:
    - text: 'Get Jiggy with it - trust i didnt make this - game dev?'
      result: GetJiggy
    - text: 'I KNEW IT HAAHAHAHHAHAHHA YOUR HANDBOOK SUCKS'
      result: EvilLaughEnding
    - text: 'Tell them you accept their apology'
      result: AcceptApology

GetJiggy:
  stats:
    - PlayerIntelligence: -1
  intro: 'The principal JOINS YOU and starts breakdancing.'
  text: 'is ducktape safe for keeping the poopy in? What do you say?'
  choices:
    - text: 'yes'
      result: DucktapeSafe
    - text: 'no'
      result: DucktapeNotSafe
    - text: 'indead'
      result: DucktapeSafe

PunchMan:
  intro: 'You look at the man. And punch them.'
  text: 'The man takes their phone out runs away and calls the police. What do you do?'
  stats: 
    - PlayerIntelligence: -1
  choices:
    - text: 'Follow the man'
      result: FollowMan
    - text: 'Run away'
      result: RunFromPolice
    - text: 'Stay put'
      result: StayPut

FollowMan:
  intro: 'You follow the man.'
  stats:
    - PlayerIntelligence: -1
  text: 'He goes inside his house. What do you do?'
  choices:
    - text: 'Go inside his house'
      result: EnterHouse
    - text: 'Go to school'
      result: GoToSchoolAfterPunch

EnterHouse:
  stats:
    - PlayerIntelligence: -1
  intro: 'You follow him inside his house.'
  text: 'The man was a murderer. What do you do?'
  choices:
    - text: 'FIGHT BACK'
      result: FightMurderer
    - text: 'Give up'
      result: GiveUpToMurderer

FightMurderer:
  intro: 'You fight back.'
  text: 'They kill you'
  choices:
    - text: 'You died. This choice does not work'
      result: End

GiveUpToMurderer:
  stats:
    - PlayerIntelligence: 1
  intro: 'You give up.'
  text: "They see that you surrendered and are about to kill you. But the police arrive and you are saved"
  choices:
    - text: 'Go to school'
      result: GoToSchoolAfterMurder
    - text: 'Go home'
      result: GoHome
Gohome:
  intro: 'You go home'
  text: 'Do you play video games?'
  choices:
    - text: 'Yes'
      result: VideoGames
    - text: 'No'
      result: NoVideoGames
GoToSchoolAfterMurder:
  intro: 'You go to school after the murder attempt. When you get their you explain what happend and they understand'
  text: 'You go to your third period. Do you do your work?'
  choices:
    - text: 'Yes'
      result: DoWorkThirdPeriod
    - text: 'No'
      result: NoWorkThirdPeriod
DoWorkThirdPeriod:
  intro: 'You do your work and the first problem you need to do is 3+3'
  text: 'What is the answer?'
  choices:
    - text: '1'
      result: WrongAnswerThirdPeriod
    - text: '2'
      result: WrongAnswerThirdPeriod
    - text: '3'
      result: WrongAnswerThirdPeriod
    - text: '4'
      result: WrongAnswerThirdPeriod
    - text: '5'
      result: WrongAnswerThirdPeriod
    - text: '6'
      result: CorrectAnswerThirdPeriod
    - text: '7'
      result: WrongAnswerThirdPeriod
    - text: '8'
      result: WrongAnswerThirdPeriod
    - text: '9'
      result: WrongAnswerThirdPeriod
    - text: '10'
      result: WrongAnswerThirdPeriod
WrongAnswerThirdPeriod:
  intro: 'You got the problem wrong. You go through the other periods and don''t do well'
  stats:
    - PlayerIntelligence: -5
    - PlayersGrade: -10
  text: 'Do you leave school early without permission?'
  choices:
    - text: 'Yes'
      result: LeaveSchoolEarlyWithoutPermission
    - text: 'No'
      result: FinishFirstSchoolDay
LeaveSchoolEarlyWithoutPermission:
  stats:
    - PlayerIntelligence: -1
  intro: 'You try to sneak out of school early'
  text: 'A teacher caughts you but doesn''t punish you. What do you do?'
  choices:
    - text: 'Continue school'
      result: FinishFirstSchoolDay
    - text: 'Practice and try again'
      result: PracticeEscapingFirstDayAndTryAgain


GetUpOutOfBed:
  stats:
    - PlayerIntelligence: 1
  intro: 'You get out of bed.'
  introimage: OutOfBed
  text: 'Do you go to school?'
